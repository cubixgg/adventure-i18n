# Only fr_FR is bundled, not fr_CA - a client reporting fr_CA (or any other French regional
# variant) is served this bundle via LanguageVariantFallback, never the en_us fallback locale.
# See LanguageVariantFallbackTest / KeyedTranslatorTest in adventure-i18n-core for the same rule.
demo.prefix = <accent><bold>[Demo]</bold></accent>
demo.join = <prefix> <success><player></success> <muted>a rejoint la partie.</muted>
demo.welcome = <prefix> <success>Bienvenue, <player> !</success> <muted>Essayez</muted> <yellow>/lang</yellow><muted>,</muted> <yellow>/score</yellow> <muted>ou</muted> <yellow>/shop</yellow><muted>.</muted>
demo.help = <prefix> <muted>Commandes :</muted> <yellow>/lang</yellow><muted>,</muted> <yellow>/score</yellow><muted>,</muted> <yellow>/shop</yellow>
demo.lang.usage = <prefix> <error>Usage :</error> <muted>/lang suivi d'un code de langue, ex.</muted> <info><example></info><muted>. Disponible :</muted> <info><available></info>
demo.lang.unknown = <prefix> <error>Code de langue inconnu</error> <info><input></info><error>.</error> <muted>Disponible :</muted> <info><available></info>
demo.lang.set = <prefix> <success>Votre langue est maintenant</success> <info><code></info><success>.</success> <muted>Ceci est une préférence gérée côté serveur via LocaleSource, indépendante du réglage de votre client.</muted>
demo.lang.reset = <prefix> <success>Préférence de langue réinitialisée</success> <muted>- les messages rendus pour vous via LocaleSource reviennent maintenant à</muted> <info><code></info>
demo.score = <prefix> <info>Score de démo : <points></info> <muted>(rendu immédiatement via LocaleSource, pas la langue rapportée par le client)</muted>
